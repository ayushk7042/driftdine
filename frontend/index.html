<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Driftdine — Explore. Learn. Stay ahead.</title>
    <meta name="description" content="Driftdine publishes sharp, fast-moving coverage of tech, SaaS, AI and the tools that run modern businesses." />
    <meta name="google-site-verification" content="09McNNIFnmWvzc4bTWPWqQdpOgekxPbPEeaVYJHKFIg" />
    <meta name="theme-color" content="#06150f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="Driftdine" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("dd_theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMPX6C10XN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // page views are sent per route by the app (single-page site), so the automatic one is off
      gtag('config', 'G-SMPX6C10XN', { send_page_view: false });
      gtag('config', 'G-C9R6S83SWD', { send_page_view: false });
    </script>
    <style>
      #root > .boot { min-height: 100vh; display: grid; place-items: center; background: #f6f6f1; }
      .dark #root > .boot { background: #06150f; }
      #root > .boot img { width: 56px; height: auto; animation: bootpulse 1.4s ease-in-out infinite; }
      @keyframes bootpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/mark.webp" alt="Driftdine" width="56" height="55" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
